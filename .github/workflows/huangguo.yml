name: Update Huangguo CMS
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 $GITHUB_WORKSPACE/.github/scripts/hg_build.py $GITHUB_WORKSPACE/huangguo_cms.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huangguo_cms.json
          git diff --staged --quiet || git commit -m "update huangguo"
          git diff --staged --quiet || git push
